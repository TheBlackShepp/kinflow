<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="130" fill="#ffffff" opacity="0.08"/>
  <circle cx="1100" cy="280" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="140" cy="280" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="60" cy="60" r="70" fill="#ffffff" opacity="0.08"/>

  <!-- calendar -->
  <g transform="translate(540 70)">
    <rect x="0" y="24" width="120" height="104" rx="14" fill="#ffffff"/>
    <rect x="0" y="24" width="120" height="26" rx="14" fill="#ede9fe"/>
    <circle cx="26" cy="14" r="6" fill="#ffffff"/>
    <circle cx="94" cy="14" r="6" fill="#ffffff"/>
    <rect x="16" y="66" width="18" height="13" rx="3" fill="#a78bfa"/>
    <rect x="40" y="66" width="18" height="13" rx="3" fill="#c4b5fd"/>
    <rect x="64" y="66" width="18" height="13" rx="3" fill="#a78bfa"/>
    <rect x="88" y="66" width="18" height="13" rx="3" fill="#c4b5fd"/>
    <rect x="16" y="86" width="18" height="13" rx="3" fill="#c4b5fd"/>
    <rect x="40" y="86" width="18" height="13" rx="3" fill="#a78bfa"/>
    <rect x="64" y="86" width="18" height="13" rx="3" fill="#c4b5fd"/>
    <rect x="88" y="86" width="18" height="13" rx="3" fill="#a78bfa"/>
  </g>

  <!-- fork -->
  <g transform="translate(800 95)">
    <rect x="18" y="120" width="8" height="80" rx="4" fill="#ffffff"/>
    <path d="M 8 0 L 10 60 Q 22 66 34 60 L 36 0 Z" fill="#ffffff"/>
    <rect x="4" y="8" width="7" height="55" rx="3.5" fill="#ffffff"/>
    <rect x="33" y="8" width="7" height="55" rx="3.5" fill="#ffffff"/>
    <rect x="18.5" y="0" width="7" height="60" rx="3.5" fill="#ffffff"/>
  </g>

  <!-- spoon -->
  <g transform="translate(845 95)">
    <rect x="22" y="120" width="8" height="80" rx="4" fill="#ffffff"/>
    <ellipse cx="26" cy="28" rx="17" ry="30" fill="#ffffff"/>
  </g>

  <!-- floating plate -->
  <circle cx="290" cy="85" r="34" fill="#ffffff"/>
  <circle cx="290" cy="85" r="22" fill="none" stroke="#a5b4fc" stroke-width="5"/>
</svg>
