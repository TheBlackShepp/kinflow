<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="1050" cy="60" r="130" fill="#ffffff" opacity="0.08"/>
  <circle cx="1120" cy="290" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="80" cy="300" r="90" fill="#ffffff" opacity="0.08"/>
  <circle cx="30" cy="50" r="60" fill="#ffffff" opacity="0.08"/>

  <!-- house -->
  <g transform="translate(600 170)">
    <rect x="-75" y="30" width="150" height="110" rx="6" fill="#ecfdf5"/>
    <path d="M -95 38 L 0 -52 L 95 38 Z" fill="none" stroke="#a7f3d0" stroke-width="10" stroke-linejoin="round"/>
    <rect x="-45" y="70" width="44" height="70" rx="4" fill="#a7f3d0"/>
    <rect x="14" y="70" width="40" height="48" rx="4" fill="#34d399"/>
    <rect x="-105" y="96" width="30" height="34" rx="4" fill="#d1fae5"/>
    <rect x="92" y="78" width="30" height="40" rx="4" fill="#d1fae5"/>
  </g>

  <!-- person left -->
  <g transform="translate(360 205)">
    <circle cx="0" cy="-42" r="24" fill="#ffffff"/>
    <path d="M -34 40 Q -34 -2 0 -2 Q 34 -2 34 40 Z" fill="#ffffff"/>
  </g>

  <!-- person right -->
  <g transform="translate(845 205)">
    <circle cx="0" cy="-42" r="24" fill="#ecfdf5"/>
    <path d="M -34 40 Q -34 -2 0 -2 Q 34 -2 34 40 Z" fill="#ecfdf5"/>
  </g>

  <!-- link / invitation -->
  <g transform="translate(1005 205)">
    <path d="M -30 -6 Q -30 -34 0 -34 Q 30 -34 30 -6 Q 30 22 0 22 Q -30 22 -30 -6 Z" fill="none" stroke="#d1fae5" stroke-width="9"/>
    <line x1="0" y1="-34" x2="0" y2="22" stroke="#d1fae5" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- sparkles -->
  <path d="M 180 90 l 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#ffffff" opacity="0.7"/>
  <path d="M 830 42 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" fill="#ecfdf5" opacity="0.7"/>
  <path d="M 1090 120 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#d1fae5" opacity="0.8"/>
</svg>
