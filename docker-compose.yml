services:
  app:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - familywall-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/kinflow.db
      - JWT_SECRET=${JWT_SECRET:-change_me_in_production}
      - PORT=4000
    restart: unless-stopped

volumes:
  familywall-data:
